[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "p2plab"
version = "0.1.6"
description = "Two-peer IPv4/IPv6 connectivity lab with durable central diagnostics"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "LuorixDev"}]
dependencies = [
  "aiohttp>=3.11,<4", "aioquic>=1.2,<2", "aiortc>=1.13,<2",
  "cryptography>=44,<51", "psutil>=6,<8", "defusedxml>=0.7,<1",
  "textual>=8.2,<9",
]

[project.urls]
Repository = "https://github.com/LuorixDev/hole-punch-test"
Issues = "https://github.com/LuorixDev/hole-punch-test/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
p2p-server = "p2plab.server:main"
p2p-client = "p2plab.client:main"
p2p-logs = "p2plab.export:main"

[tool.setuptools.packages.find]
include = ["p2plab*"]
namespaces = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
