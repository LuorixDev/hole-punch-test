name: Private client build artifacts
on:
  workflow_dispatch:
  push:
    branches: [build/p2p-observatory]
permissions:
  contents: read
concurrency:
  group: clients-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
          - os: windows-2022
            target: windows
          - os: ubuntu-24.04
            target: android
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: p2pchat/package-lock.json
      - uses: actions/setup-python@v6
        with:
          # Resolve an available platform build; artifact manifest records actual patch.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            p2pchat/requirements.txt
            p2pchat/platform/build-requirements.txt
            p2pchat/platform/constraints.txt
      - name: Install locked npm dependencies (no unreviewed lifecycle scripts)
        working-directory: p2pchat
        run: npm ci --ignore-scripts
      - name: Install explicitly approved Electron runtime
        if: matrix.target != 'android'
        working-directory: p2pchat
        run: node node_modules/electron/install.js
      - name: Python dependencies and bundler
        run: python -m pip install -r p2pchat/requirements.txt -r p2pchat/platform/build-requirements.txt -c p2pchat/platform/constraints.txt
      - name: Platform and client gates
        working-directory: p2pchat
        shell: bash
        run: |
          set -o pipefail
          mkdir -p releases
          node --test tests/platform/*.test.cjs tests/client/*.test.cjs 2>&1 | tee releases/js-tests.log
          npm audit --omit=dev --audit-level=moderate
          npm audit --audit-level=high
      - name: Python gates (repository root, including cross-language fixtures)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p2pchat/releases
          python -m pytest p2pchat/tests -q 2>&1 | tee p2pchat/releases/python-tests.log
      - name: Build desktop native sidecar and client
        if: matrix.target != 'android'
        working-directory: p2pchat
        shell: bash
        run: |
          set -o pipefail
          npm run dist:${{ matrix.target }} 2>&1 | tee releases/build.log
      - uses: actions/setup-java@v5
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '21.0.10'
      - name: Build Android using preinstalled runner SDK (no license acceptance)
        if: matrix.target == 'android'
        working-directory: p2pchat
        shell: bash
        run: |
          set -o pipefail
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          npm run android:sync
          bash android/gradlew -p android --no-daemon -Pandroid.builder.sdkDownload=false assembleDebug 2>&1 | tee releases/build.log
          cp android/app/build/outputs/apk/debug/*.apk releases/
      - name: Record hashes, source manifest, and dependency audit
        if: always()
        working-directory: p2pchat
        shell: bash
        run: |
          mkdir -p releases
          npm audit --json > releases/npm-audit.json || true
          python tools/artifact-manifest.py
          if [ -d releases/linux-unpacked ]; then tar -czf releases/p2p-observatory-linux-x64.tar.gz -C releases linux-unpacked; fi
          python tools/artifact-manifest.py
      - name: Upload private build output and failure evidence (no release)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: p2p-observatory-${{ matrix.target }}-${{ github.sha }}
          path: |
            p2pchat/releases/*.exe
            p2pchat/releases/*.tar.gz
            p2pchat/releases/*.apk
            p2pchat/releases/*.json
            p2pchat/releases/*.log
            p2pchat/android/**/build/reports/**
            p2pchat/platform/work/p2p-native/warn-*.txt
          if-no-files-found: error
          retention-days: 14
